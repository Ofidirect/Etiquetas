<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="logo_1.ico" type="image/x-icon" />

    <title>Impresión Etiquetas Zebra</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .form {
        margin: auto;
        padding: 20px;
        width: 700px;
        background-color: rgb(235, 235, 235);
      }
      .desing {
        width: 320px;
        margin: 20px auto;
      }
      .card-body {
        padding: 8px;
      }
      .label-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .code-text {
        font-size: 26px;
        font-weight: bold;
        line-height: 1;
        margin: 0;
      }
      .barCode {
        text-align: right;
        margin: 0;
      }
      svg#barcode {
        width: 120px;
        height: 35px;
      }
      svg#serialBarcode {
        width: 140px;
        height: 28px;
      }
      table {
        font-size: 10px;
        width: 100%;
        text-align: center;
        margin: auto;
      }
      table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      th {
        font-size: 9px;
        background-color: #f8f9fa;
        padding: 1px;
      }
      td {
        font-size: 11px;
        font-weight: bold;
        padding: 2px;
      }

      @media print {
        @page {
          size: landscape;
          width: 80mm;
          height: 50mm;
          margin: 0;
        }
        body {
          background: white;
        }
        .form {
          display: none !important;
        }
        .desing {
          margin: 0;
          width: 100%;
        }
        .card {
          border: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="form">
        <!-- Botones superiores -->
        <div class="d-flex justify-content-center gap-3 mb-3">
          <a class="btn btn-primary" style="width: 150px" href="index.html">Completa</a>
          <a class="btn btn-primary" style="width: 150px" href="vacia.html">Vacía</a>
          <a class="btn btn-primary" style="width: 150px" href="ofisnack.html">Ofisnack</a>
        </div>

        <!-- Encabezado con Logo y Título -->
        <header class="row align-items-center mb-3">
          <div class="col-3 text-center">
            <img src="logo_1.png" alt="ofi direct" width="100" onerror="this.style.display='none'" />
          </div>
          <div class="col-9 text-start">
            <h1 class="h2 m-0 fw-bold">Impresión de Etiquetas Zebra</h1>
          </div>
        </header>

        <!-- Campos de entrada -->
        <div class="row g-2">
          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Ingrese el código del artículo."
              aria-label="code"
              oninput="refresData(this)"
              tabindex="1"
            />
          </div>
          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Número de serie"
              aria-label="serialNumber"
              oninput="refresData(this)"
              tabindex="2"
            />
          </div>
          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Fecha de ingreso"
              aria-label="admissionDate"
              oninput="refresData(this)"
              tabindex="3"
            />
          </div>
          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Fecha de Vencimiento"
              aria-label="dueDate"
              oninput="refresData(this)"
              tabindex="4"
            />
          </div>
          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Cantidad"
              aria-label="qty"
              oninput="refresData(this)"
              tabindex="5"
            />
          </div>
          <div class="col-6">
            <input
              type="text"
              class="form-control"
              placeholder="Posición"
              aria-label="position"
              oninput="refresData(this)"
              tabindex="6"
            />
          </div>
        </div>

        <div class="mt-3">
          <button onclick="imprimir()" class="btn btn-primary px-4" tabindex="7">
            Imprimir
          </button>
          <div class="mt-1">
            <small class="text-muted">Para imprimir puedes seleccionar <code class="text-danger">Ctrl+Enter</code></small>
          </div>
        </div>
      </div>

      <!-- Previsualización de la Etiqueta -->
      <div class="desing">
        <div class="card shadow-sm" id="tema1">
          <div class="card-body">
            <div class="label-header">
              <div class="code-text" id="code">000-000</div>
              <div class="barCode">
                <svg id="barcode"></svg>
              </div>
            </div>
            
            <table>
              <thead>
                <tr>
                  <th style="width: 50%;">Ingreso</th>
                  <th style="width: 50%;">Vencimiento</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td id="admissionDate">18/9/2026</td>
                  <td id="dueDate">01/12/2099</td>
                </tr>
                <tr>
                  <th>Cantidad</th>
                  <th>Posición</th>
                </tr>
                <tr>
                  <td id="qty">00</td>
                  <td id="position">A1 01</td>
                </tr>
                <tr>
                  <th colspan="2">Número de Serie</th>
                </tr>
                <tr>
                  <td colspan="2" id="serialNumber">SN-0000</td>
                </tr>
              </tbody>
            </table>

            <!-- Código de barras dedicado para Número de Serie -->
            <div class="text-center mt-1">
              <svg id="serialBarcode"></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Librería para el Código de Barras -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <script>
      function imprimir() {
        window.print();
      }

      const fechaActual = new Date();
      const fechaFormateada = `${fechaActual.getDate()}/${fechaActual.getMonth() + 1}/${fechaActual.getFullYear()}`;
      document.getElementById("admissionDate").innerText = fechaFormateada;

      // Generador código de artículo
      function generarCodigoBarras(valor) {
        try {
          JsBarcode("#barcode", valor || "000-000", {
            format: "CODE128",
            width: 1.3,
            height: 35,
            displayValue: true,
            fontSize: 8,
            margin: 0
          });
        } catch (e) {
          console.log("Código de barras no válido");
        }
      }

      // Generador código de serie
      function generarCodigoSerie(valor) {
        try {
          JsBarcode("#serialBarcode", valor || "SN-0000", {
            format: "CODE128",
            width: 1.2,
            height: 28,
            displayValue: true,
            fontSize: 8,
            margin: 0
          });
        } catch (e) {
          console.log("Código de serie no válido");
        }
      }

      generarCodigoBarras("000-000");
      generarCodigoSerie("SN-0000");

      function refresData(e) {
        const campoDestino = e.getAttribute("aria-label");
        const valor = e.value.toUpperCase();

        if (campoDestino && document.getElementById(campoDestino)) {
          document.getElementById(campoDestino).innerText = valor !== "" ? valor : getDefaultValue(campoDestino);
        }

        if (campoDestino === "code") {
          generarCodigoBarras(valor !== "" ? valor : "000-000");
        }

        if (campoDestino === "serialNumber") {
          generarCodigoSerie(valor !== "" ? valor : "SN-0000");
        }
      }

      function getDefaultValue(id) {
        const defaults = {
          code: "000-000",
          serialNumber: "SN-0000",
          admissionDate: fechaFormateada,
          dueDate: "01/12/2099",
          qty: "00",
          position: "A1 01"
        };
        return defaults[id] || "";
      }

      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key === "Enter") {
          imprimir();
        }
      });
    </script>
  </body>
</html>
